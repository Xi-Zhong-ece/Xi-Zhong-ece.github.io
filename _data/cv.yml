    Experience:
      - company: University of Florida / University of Utah
        position: Graduate Research Assistant
        location: Gainesville, FL, USA
        start_date: 2021-08
        end_date: present
        summary: Research on coded distributed computing, elastic and heterogeneous cloud computing, and coded caching, advised by Prof. Mingyue Ji.
        highlights:
          - "**Distributed aggregation and function computation:** developed coded methods for directly computing aggregate functions in distributed systems under stragglers, avoiding unnecessary recovery of individual intermediate results; established fundamental feasibility and recovery limits through necessary and sufficient conditions and explicit constructions."
          - "**Elastic and heterogeneous cloud computing:** designed computation-assignment schemes for distributed systems with heterogeneous machine speeds, storage capacities, elasticity, and stragglers; established theoretical performance guarantees and implemented the schemes on AWS EC2, reducing completion time by up to 30% relative to prior coded assignments and by over 50% relative to uncoded baselines under stragglers."
          - "**Efficient content delivery and caching:** developed coded caching constructions with substantially reduced subpacketization, addressing a key implementation-complexity bottleneck in coded content delivery."

      - company: Rowland Hall, Salt Lake City
        position: Research Mentor (High School Student Researcher Samuel Lu)
        location: Salt Lake City, UT, USA
        start_date: 2024
        end_date: 2025
        summary: Mentored an independent research project on straggler-tolerant coded elastic computing, covering Lagrange coding fundamentals, scheme design, and numerical evaluation. The work resulted in co-authorship on two IEEE ISIT 2025 papers.

      - company: University of Utah
        position: Teaching Assistant, ECE 3500 Fundamentals of Signals and Systems
        location: Salt Lake City, UT, USA
        start_date: 2022-08
        end_date: 2023-12
        summary: "Fall 2022 and Fall 2023. Instructor: Prof. Mingyue Ji. Graded assignments and examinations and held office hours to assist students with course material."

